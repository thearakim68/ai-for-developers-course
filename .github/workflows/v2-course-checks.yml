name: Verify fictional order project
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: v2-demo/order-project
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Identify the checked revision
        run: git rev-parse HEAD
      - name: Run the project checks
        run: python -B -m unittest discover -v
      - name: Run independent overlapping CLI feedback
        run: python -B feedback/run_feedback.py . --stage cli --verbose
