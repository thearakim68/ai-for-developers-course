name: Verify fictional order project
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Identify the checked revision
        run: git rev-parse HEAD
      - name: Run the project checks
        run: python -B -m unittest discover -v
      - name: Run independent overlapping CLI feedback
        run: python -B feedback/run_feedback.py . --stage cli --verbose
