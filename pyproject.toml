[project]
name = "ai-dev-course"
version = "0.1.0"
description = "Labs for 'AI for Developers: Ship & Secure Code with AI Coding Agents'"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
openai = ["openai>=1.50"]
gemini = ["google-genai>=1.0"]
embeddings = ["sentence-transformers>=3.0"]  # optional: S1 L06 embed_demo.py (falls back to word counts without it)

[dependency-groups]
dev = ["pytest>=8", "bandit>=1.7"]

[tool.pytest.ini_options]
testpaths = ["shared", "labs", "shopapi/tests"]
